name: Bug report
description: Report something that is not working
labels: [bug]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [backend, frontend, mobile, ci, docs, other]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Include expected vs actual behaviour.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment and logs
      description: Do NOT paste secrets or personal data.
