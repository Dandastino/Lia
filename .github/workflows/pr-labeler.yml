name: PR Labeler

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

# pull_request_target is used only so the token can add labels on fork PRs.
# This workflow never checks out or executes PR code; labeler reads the
# changed-file list through the API and the config from the base branch.
permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    name: label
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/labeler@v5
        with:
          sync-labels: true
