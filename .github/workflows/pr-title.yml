name: PR Title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  semantic-title:
    name: semantic-title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check conventional-commit title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert|security)(\([a-z0-9._/-]+\))?!?: .+'
          if ! printf '%s' "$TITLE" | grep -Eq "$pattern"; then
            echo "::error::PR title must follow Conventional Commits, e.g. 'feat(backend): add X'. Got: $TITLE"
            exit 1
          fi
